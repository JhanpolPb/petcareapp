# Despliegue en Render (https://render.com) como un solo servicio web.
services:
  - type: web
    name: petcareapp
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@petcareapp.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
